
name: Build MotionX IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build MotionX for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build MotionX
        working-directory: Examples/VideoEditorDemo
        run: |
          xcodebuild \
            -project VideoEditorDemo.xcodeproj \
            -scheme VideoEditorDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MotionXBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: MotionX-iOS-Simulator-Build
          path: ${{ runner.temp }}/MotionXBuild/Build/Products/Release-iphonesimulator/
          if-no-files-found: error
